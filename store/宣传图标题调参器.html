<title>宣传图标题调参器</title>
<style>
  body{margin:0;background:#111827;font-family:"Microsoft YaHei",sans-serif;color:#E5E7EB}
  #wrap{display:flex;height:100vh}
  #canvas{flex:1;position:relative;overflow:hidden;background:#000}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none}
  #title{position:absolute;cursor:move;font-weight:bold;user-select:none;white-space:nowrap;text-shadow:var(--sh)}
  #panel{width:300px;padding:16px;background:#1F2937;overflow-y:auto;font-size:13px}
  #panel h3{margin:0 0 12px;font-size:15px;color:#FBBF24}
  .ctl{margin-bottom:14px}
  .ctl label{display:block;margin-bottom:4px;color:#9CA3AF}
  .ctl input[type=range]{width:100%}
  .ctl input[type=text],.ctl select{width:100%;padding:6px;background:#374151;border:1px solid #4B5563;color:#E5E7EB;border-radius:6px;font-size:13px;box-sizing:border-box}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:34px;height:34px;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .sw.on{border-color:#fff}
  .hint{color:#6B7280;font-size:12px;line-height:1.7}
  #status{position:fixed;bottom:10px;right:12px;background:rgba(17,24,39,.85);padding:8px 14px;border-radius:8px;font-size:12px;color:#9CA3AF;z-index:99}
</style>

  <div id="panel">
    <h3>标题调参</h3>
    <div class="ctl"><label>标题文字</label><input type="text" id="text" value="完蛋我被AI娘包围了"></div>
    <div class="ctl"><label>字号（相对底图缩放）</label><input type="range" id="size" min="24" max="160" value="76"><span id="sizeV">76</span></div>
    <div class="ctl"><label>颜色</label><div class="swatches" id="sws">
      <div class="sw on" style="background:#FFD27A" data-c="#FFD27A"></div>
      <div class="sw" style="background:#FFFFFF" data-c="#FFFFFF"></div>
      <div class="sw" style="background:#FFE4B5" data-c="#FFE4B5"></div>
      <div class="sw" style="background:#F5E9D0" data-c="#F5E9D0"></div>
      <div class="sw" style="background:#FF9E9E" data-c="#FF9E9E"></div>

      <div class="sw" style="background:#F0A878" data-c="#F0A878"></div>
    </div></div>
    <div class="ctl"><label>阴影强度</label><input type="range" id="shadow" min="0" max="20" value="6"><span id="shadowV">6</span></div>
    <div class="ctl"><label>字重</label><select id="weight">
      <option value="bold">粗体</option>
      <option value="normal">常规</option>
      <option value="lighter">细体</option>
    </select></div>
    <div class="ctl"><label>样式</label><select id="style">
      <option value="plain">纯文字</option>
      <option value="glow">发光</option>
      <option value="stroke">描边</option>
      <option value="plate">深色底板</option>
      <option value="chip">圆角胶囊底</option>
    </select></div>

      <option value="0">横排</option>
      <option value="1">竖排（从右到左）</option>
    </select></div>
    <div class="hint">💡 直接拖动文字到任意位置；<br>调整参数后满意了，把右侧面板的<br><b>参数截图</b>发给我，我按参数出最终高清图。</div>

<div id="status">字号 76 · #FFD27A</div>
<script>
const canvas = document.getElementById('canvas');
const bg = document.getElementById('bg');
const title = document.getElementById('title');
const status = document.getElementById('status');

// 底图在画布中的实际渲染尺寸（contain）
function bgRect(){
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const iw = 1920, ih = 1080;
  const s = Math.min(cw/iw, ch/ih);
  const w = iw*s, h = ih*s;
  return {x:(cw-w)/2, y:(ch-h)/2, w, h, s};
}
// 字号映射：底图像素 -> 屏幕像素
const scaleFactor = () => bgRect().s;

function apply(){
  const t = document.getElementById('text').value;
  const sz = +document.getElementById('size').value;
  const col = document.querySelector('.sw.on').dataset.c;
  const sh = +document.getElementById('shadow').value;
  const wg = document.getElementById('weight').value;
  const st = document.getElementById('style').value;
  const vt = document.getElementById('vertical').value === '1';
  document.getElementById('sizeV').textContent = sz;
  document.getElementById('shadowV').textContent = sh;
  title.textContent = t;
  title.style.fontSize = (sz * scaleFactor()) + 'px';
  title.style.fontWeight = wg;
  title.style.color = col;
  const k = (sz/100);
  title.style.setProperty('--sh', sh ? '0 ' + (3*k) + 'px ' + (6*k) + 'px rgba(0,0,0,' + (sh/20) + ')' : 'none');
  // 样式
  title.style.background = 'transparent';
  title.style.padding = '0';
  title.style.borderRadius = '0';
  title.style.webkitTextStroke = '0';
  title.style.filter = 'none';
  if(st === 'glow'){ title.style.filter = 'drop-shadow(0 0 ' + (10*k) + 'px ' + col + ')'; }
  if(st === 'stroke'){ title.style.webkitTextStroke = '2px rgba(0,0,0,0.55)'; }
  if(st === 'plate'){ title.style.background = 'rgba(10,14,28,0.55)'; title.style.padding = (14*k)+'px '+(28*k)+'px'; title.style.borderRadius = (10*k)+'px'; }
  if(st === 'chip'){ title.style.background = 'rgba(10,14,28,0.72)'; title.style.padding = (10*k)+'px '+(22*k)+'px'; title.style.borderRadius = '999px'; }
  // 竖排
  title.style.writingMode = vt ? 'vertical-rl' : 'horizontal-tb';
  title.style.letterSpacing = vt ? (6*k) + 'px' : '0.04em';
  status.textContent = '字号 ' + sz + ' · ' + col + ' · ' + st + (vt ? ' · 竖排' : '');
}
// 颜色选择
document.querySelectorAll('.sw').forEach(s => s.onclick = () => {
  document.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
  s.classList.add('on'); apply();
});
['text','size','shadow','weight','style','vertical'].forEach(id => {
  document.getElementById(id).addEventListener('input', apply);
});
// 拖拽
let drag = false, ox = 0, oy = 0;
title.addEventListener('mousedown', e => { drag = true; ox = e.clientX - title.offsetLeft; oy = e.clientY - title.offsetTop; e.preventDefault(); });
document.addEventListener('mousemove', e => { if(drag){ title.style.left = (e.clientX - ox) + 'px'; title.style.top = (e.clientY - oy) + 'px'; } });
document.addEventListener('mouseup', () => drag = false);
// 初始位置：底部居中
window.addEventListener('resize', () => apply());
window.addEventListener('load', () => {
  title.style.left = (canvas.clientWidth/2 - 400) + 'px';
  title.style.top = (canvas.clientHeight - 140) + 'px';
  apply();
});
</script>
